[package]
name = "backup_manager"
version = "0.1.0"
description = "WolfsMedia - offline portable media backup manager"
authors = ["IsmarWolf"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"
autobins = false
autotests = true
autoexamples = false
autobenches = false

[lib]
name = "backup_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "BackupManager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = [] }
thiserror = "2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"

[dev-dependencies]
tempfile = "3.20"
